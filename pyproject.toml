[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dobot-pathgen"
version = "0.1.0"
description = "CR5A dental-cleaning trajectory generation demo: plan, preview in Isaac Sim, execute on the real robot"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dobot-pathgen = "dobot_pathgen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dobot_pathgen = ["py.typed"]
